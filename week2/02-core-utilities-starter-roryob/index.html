<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Week 02 starter — Compass support types &amp; crisis notice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Hanken+Grotesk:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body class="bg-paper font-sans text-ink">
    <!-- Nothing here has a class yet. Colour, sizing, spacing, and type all
         get added by you, one utility class at a time. -->
    <main class="py-[clamp(2rem,1.5rem+2vw,3.5rem)]">
      <ul class="list-none border-t-(length:--rule) border-ink pl-0">

        <!-- Cell	<li> background + text token
          Assistive technology	bg-ink-deep + text-on-dark
          Wellbeing	bg-green + text-on-light
          Social & peer	bg-pink + text-on-light -->
        
          <li
          class="border-b-(length:--rule) border-ink bg-lime p-8 text-center text-on-light min-h-20"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mx-auto mb-4 block h-14 w-14"
          >
            <path
              d="M4 5.5C4 4.67 4.67 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"
            />
            <path
              d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13v16h5.5c.83 0 1.5-.67 1.5-1.5v-13Z"
            />
          </svg>
          <span class="font-display text-lg font-bold">Study skills</span>
        </li>
        <li
          class="border-b-(length:--rule) border-ink bg-ink-deep p-8 text-center text-on-dark min-h-20"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mx-auto mb-4 block h-14 w-14"
            
          >
            <path d="M4 13v-1a8 8 0 0 1 16 0v1" />
            <rect x="3" y="13" width="4" height="7" rx="1.5" />
            <rect x="17" y="13" width="4" height="7" rx="1.5" />
          </svg>
          <span class="font-display text-lg font-bold">Assistive technology</span>
        </li>
        <li
          class="border-b-(length:--rule) border-ink bg-green p-8 text-center text-on-light min-h-20"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mx-auto mb-4 block h-14 w-14"
          >
            <path
              d="M12 20.5s-7.5-4.6-9.8-9.2C.6 7.8 2.4 4.5 6 4.2c2-.2 3.7.9 6 3.2 2.3-2.3 4-3.4 6-3.2 3.6.3 5.4 3.6 3.8 7.1C19.5 15.9 12 20.5 12 20.5Z"
            />
          </svg>
          <span class="font-display text-lg font-bold">Wellbeing</span>
        </li>
        <li
          class="border-b-(length:--rule) border-ink bg-pink p-8 text-center text-on-light min-h-20"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mx-auto mb-4 block h-14 w-14"
          >
            <circle cx="8.5" cy="8" r="3" />
            <path d="M2.5 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
            <circle cx="17" cy="9" r="2.5" />
            <path d="M15.5 14.2c2.9.4 5 2.9 5 5.8" />
          </svg>
          <span class="font-display text-lg font-bold">Social &amp; peer</span>
        </li>

        <!--  CHALLENGE EXTRA LI  -->
        
        <li
          class="border-b-(length:--rule) border-ink bg-on-light p-8 text-center text-on-dark min-h-20"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="mx-auto mb-4 block h-14 w-14"
          >
            <!-- svg icon from https://www.svgrepo.com/svg/470866/pencil -->
          <path d="M13.5 7.5l3 3M4 20v-3.5L15.293 5.207a1 1 0 011.414 0l2.086 2.086a1 1 0 010 1.414L7.5 20H4z"></path></g>
          </svg>
          <span class="font-display text-lg font-bold">Exam accommodations</span>
        </li>
      </ul>
    </main>
    <footer class="mt-[clamp(2.5rem,2rem+3vw,4rem)]">
      <div class="mx-auto max-w-5xl px-5">
        <p
          class="border-(length:--rule) border-ink bg-pink px-5 py-4 font-display text-[1.0625rem] font-extrabold text-on-light"
        >
          Compass is not an emergency or crisis service. If you need urgent
          help, contact the Student Health Centre, ring the Samaritans free on
          116 123, or call the emergency services on 112 or 999.
        </p>
      </div>
    </footer>
  </body>
</html>
